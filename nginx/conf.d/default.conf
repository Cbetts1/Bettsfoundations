server {
    listen 80;
    server_name bettsfoundations.org www.bettsfoundations.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bettsfoundations.org www.bettsfoundations.org;

    ssl_certificate /etc/letsencrypt/live/bettsfoundations.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettsfoundations.org/privkey.pem;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
